name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "REDACTED_BY_HISTORY_PURGE"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "bakemeai.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "bakemeai"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "bakemeai.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "158308727027"
      NEXT_PUBLIC_FIREBASE_APP_ID: "REDACTED_BY_HISTORY_PURGE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
